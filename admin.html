<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - ECIL Runners</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f9fafb; }
        h1, h2, h3, .font-syncopate { font-family: 'Syncopate', sans-serif; }
    </style>
</head>
<body class="text-gray-800">
    <!-- Navbar -->
    <nav class="fixed w-full z-50 transition-all duration-300 bg-white/90 backdrop-blur-md shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <a href="index.html" class="flex items-center gap-3">
                    <img src="assets/logo.png" alt="ECIL Runners" class="h-12 w-auto object-contain">
                    <span class="font-syncopate font-bold text-xl tracking-wider text-gray-900 hidden sm:block">ECIL RUNNERS</span>
                </a>
                <div class="flex items-center gap-4">
                    <a href="index.html" class="text-sm font-bold tracking-widest uppercase text-gray-600 hover:text-[#F97316]">Back to Site</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="pt-32 pb-24 max-w-4xl mx-auto px-4">
        <div class="mb-10 text-center">
            <h1 class="text-3xl font-syncopate font-bold text-gray-900 mb-2">Admin Dashboard</h1>
            <p class="text-gray-500">Manage website content seamlessly.</p>
            <div id="admin-error" class="hidden mt-4 bg-red-100 text-red-700 p-4 rounded-xl text-sm font-medium"></div>
        </div>

        <!-- Manage Runner of the Month -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 mb-8" id="admin-panel" style="display: none;">
            <h2 class="text-xl font-syncopate font-bold text-gray-900 mb-6 flex items-center gap-3">
                <i class="fas fa-star text-[#F97316]"></i> Update Runner of the Month
            </h2>
            
            <div class="space-y-6">
                <div>
                    <label class="block text-xs font-bold tracking-widest text-gray-500 uppercase mb-2">Runner Name</label>
                    <input type="text" id="rotm-name" class="w-full bg-gray-50 border border-gray-200 text-gray-900 text-sm rounded-xl focus:ring-[#F97316] focus:border-[#F97316] block p-3">
                </div>
                
                <div>
                    <label class="block text-xs font-bold tracking-widest text-gray-500 uppercase mb-2">Inspirational Quote</label>
                    <textarea id="rotm-quote" rows="3" class="w-full bg-gray-50 border border-gray-200 text-gray-900 text-sm rounded-xl focus:ring-[#F97316] focus:border-[#F97316] block p-3"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-bold tracking-widest text-gray-500 uppercase mb-2">Runner Photo</label>
                    <div class="flex items-center gap-4">
                        <img id="rotm-preview" src="" class="w-20 h-20 rounded-full object-cover border-2 border-gray-200 hidden">
                        <label class="cursor-pointer bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                            <i class="fas fa-camera mr-2"></i> Upload New Photo
                            <input type="file" id="rotm-file" class="hidden" accept="image/*">
                        </label>
                        <span id="upload-status" class="text-sm text-gray-500 hidden"><i class="fas fa-spinner fa-spin mr-1"></i> Uploading...</span>
                    </div>
                    <input type="hidden" id="rotm-image-url">
                </div>

                <button id="save-rotm" class="w-full bg-[#F97316] hover:bg-[#ea580c] text-white font-bold py-3 px-4 rounded-xl transition-colors mt-4 flex justify-center items-center gap-2">
                    <i class="fas fa-save"></i> Save Changes
                </button>
                <div id="save-success" class="hidden text-green-600 text-sm font-bold text-center mt-2"><i class="fas fa-check-circle mr-1"></i> Successfully updated!</div>
            </div>
        </div>
        
        <div id="loading-state" class="text-center py-12 text-gray-500">
            <i class="fas fa-spinner fa-spin text-3xl mb-4"></i>
            <p>Authenticating...</p>
        </div>
    </div>

    <!-- We will reuse the same supabase client from script.js config indirectly by declaring it here -->
    <script src="admin.js"></script>
</body>
</html>
