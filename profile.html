<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - ECIL Runners</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], syncopate: ['Syncopate', 'sans-serif'] }
                }
            }
        }
        // Early theme initialization
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-300 min-h-screen flex flex-col antialiased">

    <!-- Navbar -->
    <nav class="fixed w-full z-50 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md border-b border-gray-100 dark:border-gray-800 transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <a href="index.html" class="flex items-center gap-4 group">
                    <div class="w-10 h-10 bg-gray-100 dark:bg-gray-800 rounded-full flex items-center justify-center text-gray-900 dark:text-white group-hover:bg-[#F97316] group-hover:text-white transition-colors">
                        <i class="fas fa-arrow-left"></i>
                    </div>
                    <span class="font-syncopate font-bold text-lg hidden sm:block">Back to Home</span>
                </a>
                <div class="flex items-center gap-4">
                    <button id="theme-toggle-profile" class="text-gray-800 dark:text-gray-200 hover:text-[#F97316] transition-colors w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-100 dark:hover:bg-gray-800">
                        <i class="fas fa-moon text-xl"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow pt-32 pb-24 px-4 sm:px-6 lg:px-8 max-w-4xl mx-auto w-full">
        <div class="mb-10 text-center">
            <h1 class="text-4xl font-syncopate font-bold mb-3">Runner Profile</h1>
            <p class="text-gray-500 dark:text-gray-400 font-light">Manage your personal details and running statistics.</p>
        </div>

        <div class="bg-white dark:bg-gray-800 rounded-3xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden">
            
            <form id="profile-form" class="p-8 sm:p-12">
                <!-- Avatar Upload Section -->
                <div class="flex flex-col sm:flex-row items-center gap-8 mb-12 pb-12 border-b border-gray-100 dark:border-gray-700">
                    <div class="relative group cursor-pointer" onclick="document.getElementById('profile-avatar-upload').click()">
                        <div class="w-32 h-32 rounded-full overflow-hidden border-4 border-gray-50 dark:border-gray-900 shadow-xl bg-gray-200 dark:bg-gray-700 flex items-center justify-center">
                            <img id="profile-avatar-preview" src="" alt="Avatar" class="w-full h-full object-cover hidden">
                            <i id="profile-avatar-fallback" class="fas fa-user text-5xl text-gray-400 dark:text-gray-500"></i>
                        </div>
                        <div class="absolute inset-0 bg-black/50 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                            <i class="fas fa-camera text-white text-2xl"></i>
                        </div>
                    </div>
                    <div class="text-center sm:text-left flex-1">
                        <h3 class="text-xl font-bold mb-2">Profile Photo</h3>
                        <p class="text-sm text-gray-500 dark:text-gray-400 mb-0">Click your avatar to upload a new high-res photo for the leaderboard.</p>
                        <input type="file" id="profile-avatar-upload" accept="image/*" class="hidden">
                        <input type="hidden" id="profile-avatar-url">
                    </div>
                </div>

                <!-- Personal Details Grid -->
                <h3 class="text-sm font-bold tracking-widest text-[#F97316] uppercase mb-6">Personal Details</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-12">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest mb-2">Full Name</label>
                        <input type="text" id="profile-name" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 focus:ring-2 focus:ring-[#F97316] outline-none transition-all" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest mb-2">Email Address</label>
                        <input type="email" id="profile-email" class="w-full bg-gray-100 dark:bg-gray-900/50 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 text-gray-500 cursor-not-allowed" disabled>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest mb-2">Mobile Number</label>
                        <input type="tel" id="profile-phone" placeholder="+91 9999999999" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 focus:ring-2 focus:ring-[#F97316] outline-none transition-all" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest mb-2">Age</label>
                        <input type="number" id="profile-age" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 focus:ring-2 focus:ring-[#F97316] outline-none transition-all" min="10" max="100">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest mb-2">Gender</label>
                        <select id="profile-gender" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 focus:ring-2 focus:ring-[#F97316] outline-none transition-all appearance-none">
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <!-- Runner Specifics -->
                <h3 class="text-sm font-bold tracking-widest text-[#F97316] uppercase mb-6">Runner Information</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-12">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest mb-2">Running Group Name</label>
                        <input type="text" id="profile-group" placeholder="e.g. ECIL Speedsters" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 focus:ring-2 focus:ring-[#F97316] outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest mb-2">T-Shirt Size</label>
                        <select id="profile-shirt" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 focus:ring-2 focus:ring-[#F97316] outline-none transition-all appearance-none">
                            <option value="">Select Size (For Merch & Events)</option>
                            <option value="XS">XS</option>
                            <option value="S">S</option>
                            <option value="M">M</option>
                            <option value="L">L</option>
                            <option value="XL">XL</option>
                            <option value="XXL">XXL</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest mb-2">Blood Group</label>
                        <select id="profile-blood" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 focus:ring-2 focus:ring-[#F97316] outline-none transition-all appearance-none">
                            <option value="">Select (For Event Emergencies)</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest mb-2">Emergency Contact #</label>
                        <input type="tel" id="profile-emergency" placeholder="Phone Number" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 focus:ring-2 focus:ring-[#F97316] outline-none transition-all">
                    </div>
                </div>

                <div id="profile-msg" class="hidden mb-6 p-4 rounded-xl text-sm font-bold text-center"></div>

                <div class="flex justify-end">
                    <button type="submit" id="profile-save-btn" class="bg-[#F97316] text-white px-10 py-4 rounded-xl font-bold tracking-widest uppercase hover:bg-gray-900 transition-colors shadow-lg shadow-[#F97316]/30 flex items-center gap-3">
                        <i class="fas fa-save"></i> <span>Save Profile</span>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script src="profile.js"></script>
</body>
</html>
